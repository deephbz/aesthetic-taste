[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aesthetic-taste"
version = "0.1.0"
description = "Small, inspectable tools for executable research reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "deephbz" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/deephbz/aesthetic-taste"

[project.scripts]
report = "executable_reports.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/executable_reports"]
