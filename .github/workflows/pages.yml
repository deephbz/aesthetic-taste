name: deploy charting example

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "examples/charting-api-philosophy/**"
      - "scripts/stage_example_site.py"
      - "src/executable_reports/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  UV_NO_CONFIG: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13.12"
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.10.18"
      - run: uv sync --locked --no-config
      - name: Execute report
        run: uv run --no-config report run examples/charting-api-philosophy --uv
      - name: Render saved outputs
        run: uv run --no-config report render examples/charting-api-philosophy
      - name: Inspect artifacts
        run: >-
          uv run --no-config report inspect examples/charting-api-philosophy --render
          > examples/charting-api-philosophy/evidence/report-inspection.json
      - name: Stage Pages artifact
        run: uv run --no-config python scripts/stage_example_site.py
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
