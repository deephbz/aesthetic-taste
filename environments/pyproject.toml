[project]
name = "aesthetic-taste-environments"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
lab = [
    "jupyter-resource-usage>=1.3.0",
    "jupyterlab>=4.6.3",
    "jupyterlab-execute-time>=3.3.0",
    "jupyterlab-vim>=4.1.4",
    "jupytext>=1.19.5",
]
kernel = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbconvert>=7.17.0",
    "aesthetic-taste",
]
default = [
    { include-group = "kernel" },
    "bokeh>=3.9.1",
    "datashader>=0.19.1",
    "holoviews>=1.23.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "polars>=1.0",
    "pydot",
    "panel>=1.9.3",
    "panel-material-ui>=0.14.0",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
    "xarray>=2026.7.0",
]

[tool.uv]
default-groups = []
package = false

[tool.uv.sources]
aesthetic-taste = { path = "../components/reporting", editable = true }
