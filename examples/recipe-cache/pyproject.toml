[project]
name = "recipe-cache"
version = "0.1.0"
description = "Explicit, correctly keyed persistence for slow computation steps"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
polars = ["polars==1.42.1"]

[dependency-groups]
dev = ["pytest", "polars==1.42.1", "numpy", "ipykernel", "nbclient", "nbformat", "jupytext"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recipe_cache"]

[tool.uv]
exclude-newer = "7 days"
